# One-command local run: the bot and its PostgreSQL database.
# Needs a filled .env (see .env.example), including POSTGRES_PASSWORD.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rcd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rcd
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcd -d rcd"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://rcd:${POSTGRES_PASSWORD}@db:5432/rcd
    volumes:
      - data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
  data:
