[package]
name = "rcd"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.87"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
grammers-client = { version = "0.10", default-features = false, features = ["fs", "html", "parse_invite_link"] }
grammers-mtsender = "0.10"
grammers-session = { version = "0.10", default-features = false }
grammers-tl-types = "0.10"
mime_guess = "2.0.5"
rand = "0.10.3"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "migrate", "macros", "sqlite"] }
sysinfo = "0.36.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "time", "process", "fs", "sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-general-category = "1.1.0"

[profile.release]
strip = true

[workspace]
